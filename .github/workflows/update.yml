name: Update Lottery Data
on:
  schedule:
    - cron: '0,30 13-15 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Fetch and Overwrite Data
        run: |
          python3 - << 'EOF'
          import urllib.request
          import json
          import sys

          print("=== 开始抓取数据 ===")
          # 使用国内大厂 CDN 接口，确保全球 DNS 解析无忧
          url = 'https://api.vvhan.com/api/lottery?type=ssq'
          
          try:
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              res = urllib.request.urlopen(req, timeout=15)
              data = json.loads(res.read().decode('utf-8'))
              
              # 打印返回的数据结构，方便排错
              print(f"接口返回内容: {data}")

              if data.get('success') and data.get('data'):
                  new_data = [{
                      'code': data['data']['issue'],
                      'date': data['data']['time'].split(' ')[0],
                      'red': [int(x) for x in data['data']['red'].split(',')],
                      'blue': int(data['data']['blue'])
                  }]
                  
                  with open('data.js', 'w', encoding='utf-8') as f:
                      f.write(f'window.ssqData = {json.dumps(new_data)};')
                  print(f"✅ 抓取成功！期号：{data['data']['issue']}")
              else:
                  print("❌ 接口返回数据格式异常，没有拿到具体内容。")
                  
          except Exception as e:
              print(f"❌ 抓取失败，具体报错: {e}")
              sys.exit(1) # 强制报错，不吞掉错误
          EOF
          
      - name: Commit and Push
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Action"
          git add data.js
          git commit -m "Force update data.js" || echo "没有变更"
          git push
