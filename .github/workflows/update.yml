name: Update Lottery Data
on:
  schedule:
    - cron: '0,30 13-15 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Fetch Tencent Data
        run: |
          python3 - << 'EOF'
          import urllib.request
          import json
          import sys

          print("=== 开始抓取腾讯官方彩票接口 ===")
          # 腾讯官方接口，不屏蔽海外，数据秒更
          url = 'https://web.ifzq.gtimg.cn/appstock/app/lottery/ssq/kjinfo?type=0&num=10'
          
          try:
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              res = urllib.request.urlopen(req, timeout=15)
              data = json.loads(res.read().decode('utf-8'))
              
              # 提取数据列表
              kjinfo = data.get('data', {}).get('kjinfo', [])
              if not kjinfo:
                  print("❌ 腾讯接口返回为空")
                  sys.exit(1)
                  
              result = []
              for item in kjinfo:
                  result.append({
                      'code': item['issue'],
                      'date': item['kjtime'],
                      'red': [int(x) for x in item['red'].split(' ')],
                      'blue': int(item['blue'])
                  })
                  
              with open('data.js', 'w', encoding='utf-8') as f:
                  f.write(f'window.ssqData = {json.dumps(result)};')
                  
              print(f"✅ 成功抓取腾讯彩票数据！最新期号: {result[0]['code']}")
                  
          except Exception as e:
              print(f"❌ 抓取失败: {e}")
              sys.exit(1)
          EOF
          
      - name: Commit and Push
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Action"
          git add data.js
          git commit -m "Update data.js from Tencent" || echo "没有变更"
          git push
