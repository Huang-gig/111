name: Update Lottery Data
on:
  schedule:
    - cron: '30 13 * * *' # 每天 UTC 13:30 (北京时间 21:30)
  workflow_dispatch: 

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Fetch Latest Data
        run: |
          # 改用国内第三方接口，绕过官网封锁
          curl -s "https://api.pearktrue.cn/api/lottery/?type=ssq" -o raw.json
          cat raw.json | jq '[.data[] | {code: .issue, date: (.open_time | split(" ")[0]), red: (.front | split(",") | map(tonumber)), blue: (.back | tonumber)}]' > data.json
          
      - name: Commit and Push
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Action"
          git add data.json
          git commit -m "Auto update lottery data" || exit 0
          git push
