name: Update Lottery Data
on:
  schedule:
    - cron: '0,30 13-15 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Fetch Tencent Data via Proxy
        run: |
          python3 - << 'EOF'
          import urllib.request
          import json
          import sys

          print("=== 开始通过代理抓取腾讯数据 ===")
          
          # 使用 corsproxy.io 代购腾讯的接口，彻底解决反爬和IP限制
          tencent_url = 'https://web.ifzq.gtimg.cn/appstock/app/lottery/ssq/kjinfo?type=0&num=10'
          proxy_url = f'https://corsproxy.io/?{tencent_url}'
          
          try:
              req = urllib.request.Request(proxy_url, headers={'User-Agent': 'Mozilla/5.0'})
              res = urllib.request.urlopen(req, timeout=15)
              raw_text = res.read().decode('utf-8')
              
              data = json.loads(raw_text)
              
              # 检查解析出来的是不是字典
              if not isinstance(data, dict):
                  print(f"❌ 数据格式不对，返回内容: {raw_text[:100]}")
                  sys.exit(1)
                  
              kjinfo = data.get('data', {}).get('kjinfo', [])
              if not kjinfo:
                  print("❌ 没找到 kjinfo 数据")
                  sys.exit(1)
                  
              result = []
              for item in kjinfo:
                  result.append({
                      'code': item['issue'],
                      'date': item['kjtime'],
                      'red': [int(x) for x in item['red'].split(' ')],
                      'blue': int(item['blue'])
                  })
                  
              with open('data.js', 'w', encoding='utf-8') as f:
                  f.write(f'window.ssqData = {json.dumps(result)};')
                  
              print(f"✅ 成功抓取腾讯彩票数据！最新期号: {result[0]['code']}")
                  
          except Exception as e:
              print(f"❌ 抓取失败: {e}")
              sys.exit(1)
          EOF
          
      - name: Commit and Push
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Action"
          git add data.js
          git commit -m "Update data.js via Proxy" || echo "没有变更"
          git push
