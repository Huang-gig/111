name: Update Lottery Data
on:
  schedule:
    - cron: '0,30 13-15 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Fetch Data
        run: |
          python3 - << 'EOF'
          import urllib.request, json, sys

          # 尝试拉取数据的函数
          def fetch_data():
              url = 'https://api.pearktrue.cn/api/lottery/?type=ssq'
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              try:
                  res = urllib.request.urlopen(req, timeout=10)
                  data = json.loads(res.read().decode('utf-8'))
                  if data.get('code') == 200:
                      return data.get('data', [])[:10]
              except Exception as e:
                  print("接口1请求失败，尝试备用...", e)
              
              # 接口1挂了，尝试接口2 (原始官网的第三方镜像)
              url2 = 'https://data.17500.cn/ssq_desc.txt'
              req2 = urllib.request.Request(url2, headers={'User-Agent': 'Mozilla/5.0'})
              try:
                  res2 = urllib.request.urlopen(req2, timeout=10)
                  lines = res2.read().decode('utf-8').strip().split('\n')[:10]
                  return lines
              except Exception as e:
                  print("接口2也失败了:", e)
                  return []

          data = fetch_data()
          if not data:
              print("全部接口失败，保持原状。")
              sys.exit(0)

          formatted = []
          # 判断是哪个接口返回的格式
          if isinstance(data[0], dict):
              for i in data:
                  formatted.append({
                      'code': i['issue'],
                      'date': i['open_time'].split(' ')[0],
                      'red': [int(x) for x in i['front'].split(',')],
                      'blue': int(i['back'])
                  })
          else:
              for line in data:
                  parts = line.split()
                  if len(parts) >= 9:
                      formatted.append({
                          'code': parts[0],
                          'date': parts[1],
                          'red': [int(x) for x in parts[2:8]],
                          'blue': int(parts[8])
                      })

          if formatted:
              with open('data.js', 'w') as f:
                  f.write(f'window.ssqData = {json.dumps(formatted)};')
              print("生成 data.js 成功！")
          else:
              print("解析失败，数据为空。")
          EOF
          
      - name: Commit
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Action"
          git add data.js
          git commit -m "Auto update data.js" || exit 0
          git push
