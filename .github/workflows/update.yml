name: Update Lottery Data
on:
  schedule:
    - cron: '0,30 13-15 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Fetch Pipi Data
        run: |
          python3 - << 'EOF'
          import urllib.request
          import json
          import sys

          print("=== 开始抓取皮皮 API 数据 ===")
          url = 'https://api.pearktrue.cn/api/lottery/?type=ssq'
          
          try:
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              res = urllib.request.urlopen(req, timeout=15)
              data = json.loads(res.read().decode('utf-8'))
              
              if data.get('code') == 200 and data.get('data'):
                  result = []
                  for item in data['data']:
                      result.append({
                          'code': item['issue'],
                          'date': item['open_time'].split(' ')[0],
                          'red': [int(x) for x in item['front'].split(',')],
                          'blue': int(item['back'])
                      })
                      
                  with open('data.js', 'w', encoding='utf-8') as f:
                      f.write(f'window.ssqData = {json.dumps(result)};')
                      
                  print(f"✅ 抓取成功！最新期号: {result[0]['code']}")
              else:
                  print("❌ 接口返回数据异常")
                  sys.exit(1)
                  
          except Exception as e:
              print(f"❌ 抓取失败: {e}")
              sys.exit(1)
          EOF
          
      - name: Commit and Push
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Action"
          git add data.js
          git commit -m "Update data.js" || echo "没有变更"
          git push
