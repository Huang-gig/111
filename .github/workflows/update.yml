name: Update Lottery Data
on:
  schedule:
    - cron: '0,30 13-15 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Fetch Data with Python
        run: |
          python3 -c "
          import urllib.request, json
          url = 'https://data.17500.cn/ssq_desc.txt'
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          try:
              with urllib.request.urlopen(req) as res:
                  lines = res.read().decode('utf-8').strip().split('\n')[:10]
              data = []
              for line in lines:
                  parts = line.split()
                  if len(parts) >= 9:
                      data.append({
                          'code': parts[0],
                          'date': parts[1],
                          'red': [int(x) for x in parts[2:8]],
                          'blue': int(parts[8])
                      })
              with open('data.js', 'w', encoding='utf-8') as f:
                  f.write(f'window.ssqData = {json.dumps(data)};')
              print('Success! data.js generated.')
          except Exception as e:
              print(f'Error: {e}')
          "
          
      - name: Commit
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Action"
          git add data.js
          git commit -m "Auto update data.js via Python" || exit 0
          git push
