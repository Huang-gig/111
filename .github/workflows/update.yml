name: Update Lottery Data
on:
  schedule:
    - cron: '30 13 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Fetch Data
        run: |
          curl -s "https://data.17500.cn/ssq_desc.txt" > raw.txt
          head -n 10 raw.txt | awk '{print "{\"code\":\""$1"\",\"date\":\""$2"\",\"red\":["$3","$4","$5","$6","$7","$8"],\"blue\":"$9"}"}' | jq -s '.' > data.json
          
      - name: Commit
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Action"
          git add data.json
          git commit -m "Auto update data" || exit 0
          git push
