name: Update Lottery Data
on:
  schedule:
    - cron: '0,30 13-15 * * *' 
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Fetch Data
        run: |
          python3 - << 'EOF'
          import urllib.request, json, sys

          def fetch_data():
              # 首选接口：韩小韩（国内大厂，极度稳定，实测已出132期）
              try:
                  req = urllib.request.Request('https://api.vvhan.com/api/lottery?type=ssq', headers={'User-Agent': 'Mozilla/5.0'})
                  res = urllib.request.urlopen(req, timeout=10)
                  data = json.loads(res.read().decode('utf-8'))
                  if data.get('success') and data.get('data'):
                      return [{
                          'code': data['data']['issue'],
                          'date': data['data']['time'].split(' ')[0],
                          'red': [int(x) for x in data['data']['red'].split(',')],
                          'blue': int(data['data']['blue'])
                      }]
              except Exception as e:
                  print("韩小韩API失败:", e)

              # 备用接口：17500
              try:
                  req2 = urllib.request.Request('https://data.17500.cn/ssq_desc.txt', headers={'User-Agent': 'Mozilla/5.0'})
                  res2 = urllib.request.urlopen(req2, timeout=10)
                  lines = res2.read().decode('utf-8').strip().split('\n')[:10]
                  result = []
                  for line in lines:
                      parts = line.split()
                      if len(parts) >= 9:
                          result.append({
                              'code': parts[0], 'date': parts[1],
                              'red': [int(x) for x in parts[2:8]], 'blue': int(parts[8])
                          })
                  return result
              except Exception as e:
                  print("17500接口失败:", e)

              return None

          new_data = fetch_data()
          
          if not new_data:
              print("所有接口均失败，保持原有数据不变。")
              sys.exit(0)

          # 获取本地旧期号
          old_code = "0"
          try:
              with open('data.js', 'r') as f:
                  content = f.read()
                  if '"code":' in content:
                      old_code = content.split('"code": "')[1].split('"')[0]
          except:
              pass

          new_code = new_data[0]['code']
          print(f"本地期号: {old_code}, 抓取期号: {new_code}")

          if int(new_code) >= int(old_code):
              with open('data.js', 'w') as f:
                  f.write(f'window.ssqData = {json.dumps(new_data)};')
              print(f"成功更新至: {new_code}")
          else:
              print("抓到的期号比本地旧，放弃更新。")
          EOF
          
      - name: Commit
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Action"
          git add data.js
          git commit -m "Auto update data.js" || exit 0
          git push
