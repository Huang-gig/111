name: Update Lottery Data
on:
  schedule:
    - cron: '30 13 * * *' # 每天 UTC 13:30 (北京时间 21:30)
  workflow_dispatch: 

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Fetch Latest Data with Node.js
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            try {
              // 使用更稳定的聚合接口
              const res = await fetch('https://api.pearktrue.cn/api/lottery/?type=ssq');
              const json = await res.json();
              
              if (json.code === 200 && json.data && json.data.length > 0) {
                // 抓取前 10 期，并重新组装成我们前端需要的格式
                const latest10 = json.data.slice(0, 10).map(item => ({
                  code: item.issue,
                  date: item.open_time.split(' ')[0],
                  red: item.front.split(',').map(Number),
                  blue: Number(item.back)
                }));
                
                fs.writeFileSync('data.json', JSON.stringify(latest10, null, 2));
                console.log('数据抓取成功，已生成 data.json');
              } else {
                core.setFailed('接口返回数据异常');
              }
            } catch (e) {
              core.setFailed('网络请求失败: ' + e.message);
            }
          
      - name: Commit and Push
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Action"
          git add data.json
          git commit -m "Auto update lottery data" || exit 0
          git push
