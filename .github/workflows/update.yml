name: Update Lottery Data
on:
  schedule:
    - cron: '0,30 13-15 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Fetch Data (Multi-Source)
        run: |
          if curl -s -m 10 "https://data.17500.cn/ssq_desc.txt" > raw.txt && grep -q "2026" raw.txt; then
            head -n 10 raw.txt | awk '{print "{\"code\":\""$1"\",\"date\":\""$2"\",\"red\":["$3","$4","$5","$6","$7","$8"],\"blue\":"$9"}"}' | jq -s '.' > temp.json
            echo "Source 1 Succeeded!"
          else
            curl -s -m 10 "https://api.pearktrue.cn/api/lottery/?type=ssq" | jq '[.data[] | {code: .issue, date: (.open_time | split(" ")[0]), red: (.front | split(",") | map(tonumber)), blue: (.back | tonumber)}]' > temp.json
            echo "Source 2 Succeeded!"
          fi
          # 关键一步：把 JSON 数据包装成 JS 变量，存为 data.js
          echo "window.ssqData = $(cat temp.json);" > data.js
          rm temp.json
          
      - name: Commit
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Action"
          git add data.js
          git commit -m "Auto update data.js" || exit 0
          git push
