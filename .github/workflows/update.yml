name: Update Lottery Data
on:
  schedule:
    - cron: '0,30 13-15 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Fetch Data
        run: |
          curl -s "https://api.pearktrue.cn/api/lottery/?type=ssq" -o raw.json
          node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('raw.json')); if(d.code===200){const arr=d.data.slice(0,10).map(i=>({code:i.issue,date:i.open_time.split(' ')[0],red:i.front.split(',').map(Number),blue:Number(i.back)})); fs.writeFileSync('data.js', 'window.ssqData = '+JSON.stringify(arr)+';');}"
          
      - name: Commit
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Action"
          git add data.js
          git commit -m "Auto update data.js" || exit 0
          git push
