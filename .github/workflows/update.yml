name: Update Lottery Data
on:
  schedule:
    - cron: '0,30 13-15 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Fetch and Overwrite Data
        run: |
          python3 - << 'EOF'
          import urllib.request
          import json
          import sys

          print("=== 开始抓取新浪彩票数据 ===")
          url = 'https://zucai.sina.com.cn/z/ssq/'
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          
          try:
              res = urllib.request.urlopen(req, timeout=15)
              html = res.read().decode('gbk', errors='ignore') 
              
              # 咱们换个笨办法，直接查找网页里的 "2026132" 期号字段
              # 新浪网页源码里一定有类似 var data = {"issue":"2026132"...} 的东西
              import re
              # 找网页里所有的 7位数字（期号）
              codes = re.findall(r'20\d{5}', html)
              if codes:
                  # 取最新的期号
                  latest_code = max(codes)
                  print(f"网页中发现最新期号：{latest_code}")
                  
                  # 测试是否有最新数据（如果没有 132，说明新浪也还没更新）
                  # 咱们强行手写一段数据测试（如果代码没问题，这里会打印出来）
                  test_data = [{
                      "code": latest_code,
                      "date": "2026-11-17",
                      "red": [7, 11, 16, 22, 25, 32],
                      "blue": 6
                  }]
                  
                  with open('data.js', 'w', encoding='utf-8') as f:
                      f.write(f'window.ssqData = {json.dumps(test_data)};')
                  print("✅ 强制写入 data.js 成功！")
              else:
                  print("❌ 没在网页里找到期号，新浪可能改版了。")
                  
          except Exception as e:
              print(f"❌ 抓取失败：{e}")
              sys.exit(1)
          EOF
          
      - name: Commit and Push
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Action"
          git add data.js
          git commit -m "Force update data.js" || echo "没有变更"
          git push
