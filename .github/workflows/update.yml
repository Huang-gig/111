name: Update Lottery Data
on:
  schedule:
    - cron: '0,30 13-15 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Fetch Official Partner Data
        run: |
          python3 - << 'EOF'
          import urllib.request
          import json
          import sys

          print("=== 开始抓取中彩网官方数据 ===")
          # 中彩网接口，官方合作方，对海外 IP 100% 放行
          url = 'https://jc.zhcw.com/port/client_json.php?transactionType=10001001&lotteryId=1&issueCount=10&type=0&pageNum=1'
          
          try:
              req = urllib.request.Request(url, headers={
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
                  'Referer': 'https://www.zhcw.com/'
              })
              res = urllib.request.urlopen(req, timeout=15)
              data = json.loads(res.read().decode('utf-8'))
              
              # 提取数据列表
              result_list = data.get('result', [])
              if not result_list:
                  print("❌ 接口返回为空")
                  sys.exit(1)
                  
              result = []
              for item in result_list[:10]:
                  result.append({
                      'code': item['issue'], # 期号
                      'date': item['openTime'].split(' ')[0], # 日期
                      'red': [int(x) for x in item['frontWinningNum'].split(' ')], # 红球
                      'blue': int(item['backWinningNum']) # 蓝球
                  })
                  
              with open('data.js', 'w', encoding='utf-8') as f:
                  f.write(f'window.ssqData = {json.dumps(result)};')
              print(f"✅ 成功抓取中彩网数据！最新期号: {result[0]['code']}")
                  
          except Exception as e:
              print(f"❌ 抓取失败: {e}")
              sys.exit(1)
          EOF
          
      - name: Commit and Push
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Action"
          git add data.js
          git commit -m "Update data.js from ZHCW" || echo "没有变更"
          git push
