name: Update Lottery Data
on:
  schedule:
    - cron: '0,30 13-15 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Fetch Tencent API with Node.js
        run: |
          node - << 'EOF'
          const fs = require('fs');
          const https = require('https');

          console.log("=== 开始直连腾讯官方接口 ===");
          const url = 'https://web.ifzq.gtimg.cn/appstock/app/lottery/ssq/kjinfo?type=0&num=10';

          https.get(url, (res) => {
            let data = '';
            res.on('data', chunk => data += chunk);
            res.on('end', () => {
              try {
                // 腾讯经常会包一层回调，我们需要把真正的 JSON 抠出来
                let jsonStr = data;
                const start = jsonStr.indexOf('{');
                const end = jsonStr.lastIndexOf('}');
                if (start !== -1 && end !== -1) {
                  jsonStr = jsonStr.substring(start, end + 1);
                }
                
                const parsed = JSON.parse(jsonStr);
                
                // 深度挖掘腾讯的数据结构
                let kjinfo = parsed?.data?.kjinfo;
                if (!kjinfo && parsed?.data?.data) kjinfo = parsed.data.data;
                
                if (!kjinfo || !Array.isArray(kjinfo) || kjinfo.length === 0) {
                  console.error("❌ 没找到腾讯的开奖数据列表");
                  process.exit(1);
                }

                const result = kjinfo.slice(0, 10).map(item => ({
                  code: item.issue,
                  date: item.kjtime ? item.kjtime.split(' ')[0] : "2026-11-17",
                  red: item.red.split(' ').map(Number),
                  blue: Number(item.blue)
                }));

                fs.writeFileSync('data.js', 'window.ssqData = ' + JSON.stringify(result) + ';');
                console.log(`✅ 成功抓取腾讯数据！最新期号: ${result[0].code}`);
              } catch (err) {
                console.error("❌ 解析失败:", err.message, "原始数据前100字:", data.substring(0, 100));
                process.exit(1);
              }
            });
          }).on('error', (err) => {
            console.error("❌ 网络请求失败:", err.message);
            process.exit(1);
          });
          EOF
          
      - name: Commit and Push
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Action"
          git add data.js
          git commit -m "Update data from Tencent API" || echo "没有变更"
          git push
