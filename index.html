<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能仓储拣货终端 WMS</title>
    <style>
        :root {
            --bg-page: #eef2f5;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-reg: #64748b;
            --border: #cbd5e1;
            --primary: #0f172a;
            --primary-hover: #334155;
            --accent: #0284c7;
            --warning: #d97706;
            --danger: #dc2626;
            --font-mono: 'Courier New', Courier, monospace;
        }

        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg-page); padding: 20px; color: var(--text-main); margin: 0;}
        
        /* 模拟工业终端的外壳 */
        .terminal-wrapper { max-width: 850px; margin: 0 auto; border: 2px solid var(--primary); border-radius: 6px; background: var(--bg-card); box-shadow: 4px 4px 0 rgba(0,0,0,0.1); overflow: hidden;}
        
        /* 顶部黑条 */
        .terminal-header { background: var(--primary); color: #fff; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; font-family: var(--font-mono); }
        .terminal-header h1 { margin: 0; font-size: 16px; letter-spacing: 1px; font-weight: 600;}
        .status { font-size: 12px; color: #94a3b8; }

        .content-area { padding: 25px; }

        /* 控制面板 */
        .control-panel { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed var(--border); padding-bottom: 20px; margin-bottom: 20px; flex-wrap: wrap; gap: 15px;}
        
        .switch-container { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: bold; color: var(--text-reg); font-family: var(--font-mono);}
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #cbd5e1; transition: .2s; border-radius: 4px;}
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 4px; bottom: 4px; background-color: white; transition: .2s; border-radius: 2px;}
        input:checked + .slider { background-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(20px); }

        .controls-right { display: flex; gap: 10px; align-items: center; }
        .select-box { padding: 8px 12px; font-size: 13px; border: 1px solid var(--primary); border-radius: 3px; outline: none; font-family: var(--font-mono); }
        .btn { padding: 8px 16px; background-color: var(--primary); color: white; border: 1px solid var(--primary); border-radius: 3px; font-size: 13px; cursor: pointer; transition: 0.2s; font-family: var(--font-mono); font-weight: bold; }
        .btn:hover { background-color: var(--primary-hover); }
        .btn-outline { background: #fff; color: var(--primary); }
        .btn-outline:hover { background: #f1f5f9; }

        /* 输出结果区 (模拟打印出来的拣货单) */
        .output-panel { display: none; background: #f8fafc; border: 1px solid var(--border); border-left: 4px solid var(--accent); padding: 20px; margin-bottom: 25px; }
        .output-title { font-family: var(--font-mono); font-size: 14px; font-weight: bold; border-bottom: 1px dashed var(--border); padding-bottom: 10px; margin-bottom: 15px; color: var(--primary); display: flex; justify-content: space-between;}
        
        .pick-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px dotted #e2e8f0; }
        .pick-row:last-child { border-bottom: none; }
        
        /* 伪装成货架编号 */
        .shelf-tag { display: inline-block; font-family: var(--font-mono); font-size: 16px; font-weight: bold; color: var(--primary); background: #fff; border: 1px solid var(--primary); padding: 2px 8px; border-radius: 2px; margin: 0 4px; box-shadow: 2px 2px 0 #e2e8f0; }
        .shelf-tag.b-zone { border-color: var(--warning); color: var(--warning); }

        .action-group { display: flex; gap: 8px; }
        .mini-btn { background: #fff; color: var(--text-main); border: 1px solid var(--border); padding: 4px 10px; border-radius: 3px; font-size: 12px; cursor: pointer; font-family: var(--font-mono); transition: 0.2s;}
        .mini-btn:hover { background: #f1f5f9; border-color: var(--text-reg); }
        .mini-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* 跟进队列 */
        .queue-panel { display: none; background: #fffbeb; border: 1px solid #fcd34d; padding: 15px; margin-bottom: 25px; }
        .queue-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-family: var(--font-mono); font-size: 13px; font-weight: bold; color: var(--warning); }
        .clear-btn { background: none; border: none; color: var(--danger); cursor: pointer; font-family: var(--font-mono); font-weight: bold; }
        .queue-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px dashed #fcd34d; font-family: var(--font-mono); font-size: 14px;}
        .queue-item:last-child { border-bottom: none; }

        /* 历史记录表格 (工业感) */
        .history-title { font-family: var(--font-mono); font-size: 14px; font-weight: bold; background: var(--primary); color: #fff; padding: 6px 10px; display: inline-block; margin-bottom: 15px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; font-family: var(--font-mono); border: 1px solid var(--border); }
        th { background-color: #f1f5f9; color: var(--text-main); font-weight: bold; text-align: left; padding: 10px 12px; border-bottom: 2px solid var(--border); border-right: 1px solid var(--border);}
        td { padding: 10px 12px; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); }
        tr:nth-child(even) { background-color: #f8fafc; }

        /* 弹窗 (盘点报告) */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.7); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: #fff; width: 90%; max-width: 600px; border: 2px solid var(--primary); border-radius: 4px; box-shadow: 6px 6px 0 rgba(0,0,0,0.2); max-height: 80vh; overflow-y: auto; }
        .modal-header { background: var(--primary); color: #fff; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; font-family: var(--font-mono); }
        .modal-header h2 { margin: 0; font-size: 15px; }
        .close-btn { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; }
        .modal-body { padding: 20px; }
        
        .report-box { border: 1px solid var(--border); margin-bottom: 15px; font-family: var(--font-mono); }
        .report-header { background: #f1f5f9; padding: 8px 12px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; font-size: 12px; font-weight: bold;}
        .report-content { padding: 12px; font-size: 14px;}
        .match-high { color: var(--danger); }
        .match-normal { color: var(--text-reg); }
        
        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: var(--primary); color: white; padding: 10px 20px; border-radius: 4px; font-size: 13px; z-index: 2000; display: none; font-family: var(--font-mono); box-shadow: 4px 4px 0 rgba(0,0,0,0.2); }

        @media (max-width: 600px) {
            .control-panel { flex-direction: column; align-items: stretch; }
            .controls-right { flex-wrap: wrap; justify-content: space-between;}
            .pick-row { flex-direction: column; align-items: flex-start; gap: 10px; }
            .action-group { width: 100%; justify-content: flex-end; }
            table { display: block; overflow-x: auto; }
        }
    </style>
</head>
<body>

<div class="toast" id="toast">已复制到剪贴板</div>

<div class="terminal-wrapper">
    <div class="terminal-header">
        <h1>[WMS] 智能仓储拣货终端 v3.0</h1>
        <div class="status" id="status">连接中...</div>
    </div>

    <div class="content-area">
        <div class="control-panel">
            <div class="switch-container">
                <label class="switch">
                    <input type="checkbox" id="probSwitch" checked>
                    <span class="slider"></span>
                </label>
                <span>开启排班防重机制 (避免重复派单)</span>
            </div>

            <div class="controls-right">
                <select id="pickCount" class="select-box">
                    <option value="1">生成 1 张拣货单</option>
                    <option value="3">生成 3 张拣货单</option>
                </select>
                <button class="btn" onclick="generateNewTickets()">执行拣货</button>
                <button class="btn btn-outline" onclick="openCompareModal()">出库盘点</button>
            </div>
        </div>
        
        <!-- 结果输出区 -->
        <div class="output-panel" id="resultBox">
            <div class="output-title">
                <span>=== 拣货任务单 ===</span>
                <span id="modeInfo" style="color:var(--text-reg); font-weight:normal;"></span>
            </div>
            <div id="pickDisplay"></div>
        </div>

        <!-- 跟进队列区 -->
        <div class="queue-panel" id="followBox">
            <div class="queue-header">
                <span>⚠️ 异常单跟进队列 (MAX: 3)</span>
                <button class="clear-btn" onclick="clearFollow()">[清空队列]</button>
            </div>
            <div id="followList"></div>
        </div>

        <!-- 历史记录 -->
        <div class="history-title">近期出库批次存档</div>
        <table>
            <thead>
                <tr>
                    <th>出库单号</th>
                    <th>拣货时间</th>
                    <th>A区明细 (1-33)</th>
                    <th>B区备件 (1-16)</th>
                </tr>
            </thead>
            <tbody id="lotteryData">
                <tr><td colspan="4" style="text-align:center;">读取数据库中...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- 盘点弹窗 -->
<div class="modal-overlay" id="compareModal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>出库异常盘点报告</h2>
            <button class="close-btn" onclick="closeCompareModal()">×</button>
        </div>
        <div class="modal-body" id="modalBody">
            <!-- 动态渲染 -->
        </div>
    </div>
</div>

<script>
    // 兜底数据
    const fallbackData = [
        { code: "OUT-2026130", date: "2026-11-12", red: [04, 09, 10, 15, 22, 29], blue: 08 },
        { code: "OUT-2026129", date: "2026-11-10", red: [03, 09, 16, 20, 25, 30], blue: 05 },
        { code: "OUT-2026128", date: "2026-11-08", red: [05, 06, 10, 25, 27, 30], blue: 11 },
        { code: "OUT-2026127", date: "2026-11-05", red: [13, 14, 19, 25, 29, 32], blue: 12 },
        { code: "OUT-2026126", date: "2026-11-03", red: [09, 10, 13, 22, 29, 32], blue: 12 }
    ];

    const b64Url = "aHR0cHM6Ly9yYXcuZ2l0aHVidXNlcmNvbnRlbnQuY29tL3dhbmdkYW9kYW8vRG91YmxlQ29sb3JCYWxsL21haW4vZGF0YS8yMDI2Lmpzb24=";
    const DATA_URL = atob(b64Url); 

    let latestHistory = []; 
    let myFollows = JSON.parse(localStorage.getItem('wms_follows')) || []; 
    let currentTickets = []; 

    async function fetchData() {
        const statusEl = document.getElementById('status');
        const tbody = document.getElementById('lotteryData');
        
        try {
            const res = await fetch(`${DATA_URL}?t=${Date.now()}`);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const yearData = await res.json();
            latestHistory = yearData.data.slice(-10).reverse(); 
            statusEl.innerText = `同步成功 | ${new Date().toLocaleTimeString()}`;
            statusEl.style.color = "#34d399";
        } catch (e) {
            latestHistory = fallbackData; 
            statusEl.innerText = `离线模式 | 读取本地缓存`;
            statusEl.style.color = "#fbbf24";
        } finally {
            renderTable(latestHistory);
        }
    }

    function getArr(item) {
        if (Array.isArray(item.red)) return item.red.map(Number);
        if (typeof item.red === 'string') return item.red.split(/[,\s]+/).map(Number);
        return [];
    }

    function getStreak(num, type, history) {
        let streak = 0;
        for (let i = 0; i < Math.min(3, history.length); i++) {
            if (type === 'main') {
                if (getArr(history[i]).includes(num)) streak++;
                else break;
            } else {
                if (Number(history[i].blue) === num) streak++;
                else break;
            }
        }
        return streak;
    }

    function getWeight(num, type, history) {
        const streak = getStreak(num, type, history);
        if (streak >= 3) return 0;      
        if (streak === 2) return 0.90;  
        if (streak === 1) return 0.95;  
        return 1.0;                      
    }

    // 渲染历史表格，加上 A- 和 B- 前缀
    function renderTable(dataList) {
        const tbody = document.getElementById('lotteryData');
        tbody.innerHTML = '';
        dataList.forEach(item => {
            const arrA = getArr(item);
            const aTags = arrA.map(n => `A-${String(n).padStart(2, '0')}`).join(' | ');
            const bTag = `B-${String(item.blue).padStart(2, '0')}`;
            
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="color:var(--text-reg);">${item.code}</td>
                <td>${item.date}</td>
                <td><strong style="color:var(--accent);">${aTags}</strong></td>
                <td><strong style="color:var(--warning);">${bTag}</strong></td>
            `;
            tbody.appendChild(tr);
        });
    }

    function generateOneTicket(useProb, history) {
        let poolA = [];
        for (let i = 1; i <= 33; i++) {
            poolA.push({ num: i, weight: useProb ? getWeight(i, 'main', history) : 1.0 });
        }
        let picksA = [];
        for (let k = 0; k < 6; k++) {
            let totalWeight = poolA.reduce((sum, item) => sum + item.weight, 0);
            if (totalWeight === 0) { poolA.forEach(item => item.weight = 1.0); totalWeight = poolA.length; }
            let rand = Math.random() * totalWeight;
            let idx = -1;
            for (let j = 0; j < poolA.length; j++) {
                rand -= poolA[j].weight;
                if (rand <= 0) { idx = j; break; }
            }
            if (idx === -1) idx = poolA.length - 1;
            picksA.push(poolA[idx].num);
            poolA.splice(idx, 1); 
        }
        picksA.sort((a, b) => a - b);

        let poolB = [];
        for (let i = 1; i <= 16; i++) {
            poolB.push({ num: i, weight: useProb ? getWeight(i, 'sub', history) : 1.0 });
        }
        let totalWeightB = poolB.reduce((sum, item) => sum + item.weight, 0);
        if (totalWeightB === 0) { poolB.forEach(item => item.weight = 1.0); totalWeightB = poolB.length; }
        
        let randB = Math.random() * totalWeightB;
        let pickB = 1;
        for (let j = 0; j < poolB.length; j++) {
            randB -= poolB[j].weight;
            if (randB <= 0) { pickB = poolB[j].num; break; }
        }

        return { reds: picksA, blue: pickB };
    }

    function generateNewTickets() {
        if (latestHistory.length === 0) {
            alert("数据流尚未就绪，请稍候...");
            return;
        }
        const useProb = document.getElementById('probSwitch').checked;
        const count = parseInt(document.getElementById('pickCount').value);
        
        currentTickets = []; 
        for (let i = 0; i < count; i++) {
            currentTickets.push(generateOneTicket(useProb, latestHistory));
        }
        
        renderCurrentTickets(useProb); 
        document.getElementById('resultBox').style.display = 'block';
    }

    // 渲染为仓库货架编号
    function renderCurrentTickets(useProb) {
        const displayDiv = document.getElementById('pickDisplay');
        const modeInfo = document.getElementById('modeInfo');
        displayDiv.innerHTML = '';

        currentTickets.forEach(ticket => {
            // 生成 A-XX 和 B-XX 标签
            const tagsA = ticket.reds.map(n => `<span class="shelf-tag">A-${String(n).padStart(2, '0')}</span>`).join('');
            const tagB = `<span class="shelf-tag b-zone">B-${String(ticket.blue).padStart(2, '0')}</span>`;
            
            const isSaved = myFollows.some(f => JSON.stringify(f) === JSON.stringify(ticket));

            const row = document.createElement('div');
            row.className = 'pick-row';
            row.innerHTML = `
                <div>
                    <span style="font-size:12px; color:var(--text-reg); margin-right:10px;">[拣货路径]</span>
                    ${tagsA} 
                    <span style="color:var(--border); margin:0 5px;">➔</span> 
                    ${tagB}
                </div>
                <div class="action-group">
                    <button class="mini-btn" onclick='copyTicket(${JSON.stringify(ticket)})'>[ 复制单号 ]</button>
                    <button class="mini-btn" onclick='saveToFollow(${JSON.stringify(ticket)})' ${isSaved ? 'disabled' : ''}>
                        ${isSaved ? '[ 已跟进 ]' : '[ 标记异常 ]'}
                    </button>
                </div>
            `;
            displayDiv.appendChild(row);
        });

        modeInfo.innerText = useProb 
            ? "当前策略: 防重过滤已激活" 
            : "当前策略: 完全随机分配";
    }

    function copyTicket(ticket) {
        // 复制出来也是带货架号的格式
        const arrAStr = ticket.reds.map(n => `A-${String(n).padStart(2, '0')}`).join(', ');
        const bStr = `B-${String(ticket.blue).padStart(2, '0')}`;
        const textToCopy = `${arrAStr}, ${bStr}`;
        
        navigator.clipboard.writeText(textToCopy).then(() => {
            showToast("拣货单已复制");
        }).catch(err => {
            const textArea = document.createElement("textarea");
            textArea.value = textToCopy;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);
            showToast("拣货单已复制");
        });
    }

    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.innerText = msg;
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 2000);
    }

    function saveToFollow(ticket) {
        if (myFollows.length >= 3) {
            alert("异常跟进队列已满 (Max 3)！");
            return;
        }
        if (myFollows.some(f => JSON.stringify(f) === JSON.stringify(ticket))) return;

        myFollows.push(ticket);
        updateFollowStorage();
        renderCurrentTickets(document.getElementById('probSwitch').checked); 
    }

    function deleteFollow(index) {
        myFollows.splice(index, 1);
        updateFollowStorage();
        renderCurrentTickets(document.getElementById('probSwitch').checked); 
    }

    function clearFollow() {
        if (confirm("确定清空跟进队列？")) {
            myFollows = [];
            updateFollowStorage();
            renderCurrentTickets(document.getElementById('probSwitch').checked); 
        }
    }

    function updateFollowStorage() {
        localStorage.setItem('wms_follows', JSON.stringify(myFollows));
        renderFollowList();
    }

    function renderFollowList() {
        const followBox = document.getElementById('followBox');
        const listDiv = document.getElementById('followList');
        
        if (myFollows.length === 0) {
            followBox.style.display = 'none';
            return;
        }

        followBox.style.display = 'block';
        listDiv.innerHTML = '';

        myFollows.forEach((ticket, index) => {
            const arrAStr = ticket.reds.map(n => `A-${String(n).padStart(2, '0')}`).join(', ');
            const bStr = `B-${String(ticket.blue).padStart(2, '0')}`;
            
            const div = document.createElement('div');
            div.className = 'queue-item';
            div.innerHTML = `
                <div>[单号 ${index + 1}] ${arrAStr}, ${bStr}</div>
                <button class="mini-btn" style="color:var(--danger); border-color:var(--danger);" onclick="deleteFollow(${index})">[ 移除 ]</button>
            `;
            listDiv.appendChild(div);
        });
    }

    function openCompareModal() {
        if (latestHistory.length === 0) {
            alert("仓库数据尚未加载完毕。");
            return;
        }
        if (myFollows.length === 0) {
            alert("跟进队列为空，无需盘点。");
            return;
        }

        const latestDraw = latestHistory[0];
        const batchMain = getArr(latestDraw);
        const batchSub = Number(latestDraw.blue);
        
        const modalBody = document.getElementById('modalBody');
        
        const targetA = batchMain.map(n => `A-${String(n).padStart(2, '0')}`).join(', ');
        const targetB = `B-${String(batchSub).padStart(2, '0')}`;

        let html = `
            <div style="margin-bottom: 20px; font-family: var(--font-mono); font-size:13px; background:#f8fafc; padding:10px; border:1px solid var(--border);">
                <strong>盘点基准单号:</strong> ${latestDraw.code}<br>
                <strong>实际出库记录:</strong> [ ${targetA} ] + ${targetB}
            </div>
        `;

        myFollows.forEach((ticket, index) => {
            let hitA = 0;
            ticket.reds.forEach(num => {
                if (batchMain.includes(num)) hitA++;
            });
            const hitB = ticket.blue === batchSub ? 1 : 0;
            
            const isHighMatch = hitA >= 3 || hitB === 1;
            const statusText = isHighMatch 
                ? `<span class="match-high">[异常] 高度重合</span>` 
                : `<span class="match-normal">[正常] 无冲突</span>`;
            
            const arrAStr = ticket.reds.map(n => `A-${String(n).padStart(2, '0')}`).join(', ');
            const bStr = `B-${String(ticket.blue).padStart(2, '0')}`;

            html += `
                <div class="report-box">
                    <div class="report-header">
                        <span>异常跟进单 0${index + 1}</span>
                        ${statusText}
                    </div>
                    <div class="report-content">
                        <div style="margin-bottom: 10px; color:var(--text-reg); font-size:12px;">原跟进明细: ${arrAStr}, ${bStr}</div>
                        <div style="font-weight:bold;">
                            碰撞命中: A区 <span style="color:var(--danger);">${hitA}</span> 件 | B区 <span style="color:var(--danger);">${hitB}</span> 件
                        </div>
                    </div>
                </div>
            `;
        });

        modalBody.innerHTML = html;
        document.getElementById('compareModal').style.display = 'flex';
    }

    function closeCompareModal() {
        document.getElementById('compareModal').style.display = 'none';
    }

    window.onload = function() {
        fetchData();
        renderFollowList();
    };
</script>

</body>
</html>
